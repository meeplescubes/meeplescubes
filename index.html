<style>
  :root{
    --bg: #120a1e;
    --card: #1d1330;
    --line: #34204d;
    --pink: #e0299c;
    --violet: #7b2ff2;
    --ink: #f5eefc;
    --muted: #b6a4d6;

  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background:
      radial-gradient(55% 40% at 90% -5%, rgba(224,41,156,.18), transparent 60%),
      radial-gradient(45% 35% at 0% 0%, rgba(123,47,242,.16), transparent 60%),

    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    line-height: 1.5;
  }
  a{ color: inherit; }
  h1, .brand-name{ font-family: 'Unbounded', sans-serif; margin: 0; letter-spacing: -0.01em; }

  header{
    max-width: 900px; margin: 0 auto; padding: 48px 24px 28px;

  .brand{ display: flex; align-items: center; gap: 14px; text-decoration: none; }
  .brand img{ width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 6px 16px rgba(224,41,156,.35)); }
  .brand-name{ font-size: 23px; font-weight: 800; background: linear-gradient(100deg,#ff6fd8,var(--pink) 45%,var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand-sub{ display:block; font-size:13px; font-weight:500; color:var(--muted-2); margin-top:2px; }

  .social a{ display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.03); text-decoration:none; font-size:13px; font-weight:600; }
  .social a:hover{ border-color: var(--pink); background: rgba(224,41,156,.12); }

  .intro h1{ font-size: clamp(24px,3.4vw,34px); font-weight:600; max-width: 24ch; }
  .intro p{ color: var(--muted); font-size:15px; max-width:60ch; margin-top:10px; }

  .filters{ max-width: 900px; margin: 0 auto; padding: 0 24px 24px; display: flex; flex-direction: column; gap: 14px; }
  .search{
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 12px; padding: 11px 16px;
    background: rgba(255,255,255,.02);
  }
  .search svg{ width: 16px; height: 16px; color: var(--muted-2); flex: none; }
  .search input{
    border: 0; background: none; outline: none; color: var(--ink);
    font-family: 'Manrope', sans-serif; font-size: 14px; width: 100%;
  }
  .search input::placeholder{ color: var(--muted-2); }
  .filter-group{ display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .filter-label{ font-size: 12px; color: var(--muted-2); margin-right: 4px; white-space: nowrap; }
  .chip{
    border: 1px solid var(--line); background: rgba(255,255,255,.02); color: var(--muted);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600;
    font-family: 'Manrope', sans-serif; cursor: pointer; transition: all .15s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover{ border-color: var(--pink); color: var(--ink); }
  .chip.active{
    border-color: var(--pink);
    background: linear-gradient(100deg, rgba(224,41,156,.28), rgba(123,47,242,.28));
    color: var(--ink);
  }

  .chip .mini-dice svg{ width:9px; height:9px; }
  .chip .mini-dice .pip{ fill: currentColor; }
  .result-count{ font-size: 12px; color: var(--muted-2); }
  .empty-state{ padding: 40px 4px; color: var(--muted-2); font-size: 14px; text-align: center; }

  .list{ max-width: 900px; margin: 0 auto 80px; padding: 0 24px; border-top: 1px solid var(--line); }
  .row{
    display: grid;
    grid-template-columns: 46px 1fr auto auto;
    align-items: center;
    gap: 18px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
  }
  .row:hover{ background: rgba(255,255,255,.02); }
  .swatch{
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg,#2a1445,#4a1a5c 45%,#b21f8f 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .swatch svg{ width: 55%; opacity:.55; }
  .row-text h3{ font-size:15px; font-weight:600; margin:0 0 3px; }
  .row-text p{ margin:0; font-size:13px; color: var(--muted); max-width: 46ch; }
  .dice{ display:inline-flex; gap:3px; }
  .dice svg{ width:13px; height:13px; }
  .dice svg .pip{ fill: var(--line); }
  .dice svg.on .pip{ fill: var(--pink); }
  .dice svg .face{ fill:none; stroke: var(--line); stroke-width:1.6; }
  .dice svg.on .face{ stroke: var(--pink); }
  .time{ font-size:13px; color: var(--muted-2); white-space: nowrap; display:flex; align-items:center; gap:6px; }
  .time svg{ width:13px; height:13px; }

  @media (max-width: 640px){
    .row{ grid-template-columns: 40px 1fr; row-gap: 6px; }
    .row .time, .row .dice{ grid-column: 2; }
  }

  footer{
    max-width: 900px; margin: 0 auto; padding: 20px 24px 60px; color: var(--muted-2);
    font-size: 13px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  footer a{ color: var(--muted); text-decoration:none; }
  footer a:hover{ color: var(--pink); }
</style>
</head>

  { name: "Властелин колец. Война кольца", desc: "Настоящий монументальный хардкор, способный занять весь ваш день и половину ночи. Пока один ведет бесчисленные орды Саурона на штурм Минас Тирита, второй отчаянно тащит Фродо к роковой горе, надеясь на чудо.", diff: 5, time: "120–240 мин", tmax: 240 },
  { name: "Волки Одина", desc: "Быстрая дуэльная тактика от нашего разработчика, где викинги и волки бьются за контроль над землями. Простые правила скрывают глубокий просчет, так что придется включить режим сурового скандинавского стратега.", diff: 3, time: "45–60 мин", tmax: 60 },
  { name: "Волшебные королевства", desc: "Карточный филлер, в котором вы за 15 минут собираете самую безумную комбинацию из магов, драконов и артефактов на руке. Главное — не запутаться в финальном подсчете очков, когда одно существо умножает силу другого на сто.", diff: 2, time: "15+ мин", tmax: 15 },
  { name: "Ганеша", desc: "Красочная семейная игра про сбор разноцветных драгоценных камней, которые нужно красиво выкладывать на алтарь. Настоящая услада для глаз и отличный способ спокойно поскрипеть мозгами вечером.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Ганзейский союз", desc: "Жесткое, сухое и невероятно крутое евро про торговцев, которые строят конторы и безжалостно выпихивают чужих купцов с дорог. Никакого рандома — только чистая дипломатия, блокировка путей и борьба за престиж.", diff: 5, time: "60+ мин", tmax: 60 },
  { name: "Го, Дан го", desc: "Древнейшая игра, перед которой меркнут даже шахматы. На первый взгляд вы просто ставите черные и белые камни на доску, но на деле это глубокая медитативная война за территорию, где один неверный шаг губит всю армию.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Гонка няшек", desc: "Милейшая отечественная игра, где вы делаете ставки на забавных пушистых гонщиков. Азартно, весело и сопряжено с надеждой, что именно ваш упитанный питомец добежит до финиша первым.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Гонки единорогов", desc: "Забудьте про милых розовых пони — эти единороги суровы, а ставки на их забеги высоки как никогда. Блефуйте, пакостите соперникам и надейтесь, что выбранный вами рогатый скакун не споткнется на финишной прямой.", diff: 5, time: "45+ мин", tmax: 45 },
  { name: "Гравити Фолс. Битва Воспоминаний", desc: "Отличная игра на прокачку памяти по мотивам любимого мультсериала от отечественных авторов. Помогите Дипперу и Мэйбл вернуть воспоминания жителей городка, пока Билл Шифр не захватил всё вокруг.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Грани миров", desc: "Уютный сборник мини-игр в одном флаконе, где вы управляете ресурсами и заполняете свои планшеты маркером. Прекрасный представитель жанра «крути-пиши», в котором каждый найдет задание по душе.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Громовой камень", desc: "Классический колодостроительный фэнтези-хит, где вы собираете отряд героев, закупаете им крутые мечи и отправляетесь пинать монстров в темных пещерах. Главное — не забыть взять с собой факел, иначе в темноте вас быстро съедят.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Детектор правды", desc: "Вечериночная игра категории 18+, которая заставит вас узнать о друзьях то, чего вы, возможно, знать вообще не хотели. Отвечайте на каверзные вопросы и делайте ставки на то, сколько человек за столом поступили бы так же.", diff: 1, time: "30+ мин", tmax: 30 },
  { name: "Динозавры, любимцы богов", desc: "Симпатичный менеджмент ресурсов, где вы создаете идеальную экосистему для хищников и травоядных ящеров. Старайтесь размножать динозавров так, чтобы они не сожрали друг друга раньше времени.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Добро пожаловать на Луну", desc: "Космическое продолжение «Бумажных кварталов» с полноценной кампанией и кучей разных сценариев. Рисуйте маршруты ракет, осваивайте лунный грунт и следите за тем, чтобы у ваших космонавтов не кончился кислород.", diff: 2, time: "30+ мин", tmax: 30 },
  { name: "Древний ужас", desc: "Эпическое кооперативное страдание по Лавкрафту, где вы с друзьями путешествуете по миру, закрываете врата и сходите с ума от одного взгляда на Ктулху. Готовьтесь к тому, что игра будет безжалостно вас избивать, но вы всё равно попросите добавки.", diff: 4, time: "120–240 мин", tmax: 240 },
  { name: "Дружные облачка", desc: "Милая отечественная пати-игра на реакцию, где нужно вовремя хватать правильные облака. Идеальный ледокол для компании, помогающий буквально взять соседа по столу за руку в процессе веселой суматохи.", diff: 1, time: "20+ мин", tmax: 20 },
  { name: "Дюна империя + доп", desc: "Суровый космический хардкор, сочетающий выставление рабочих и колодострой в борьбе за планету Арракис. Спайс должен течь, интриги должны плестись, а ваши войска — регулярно гибнуть в бесконечных пустынных битвах.", diff: 3, time: "60–120 мин", tmax: 120 },
  { name: "За бортом", desc: "Психологический триллер в формате настолки, где вы заперты в одной лодке со своими тайными друзьями и смертельными врагами. Делите пресную воду, деритесь за аптечки и пытайтесь не оказаться скормленным акулам.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Забытые моря", desc: "Яркое пиратское приключение с кучей юмора, морских баек и специальным приложением, которое ведет вас по сюжету. Настоящий интерактивный роман, где каждый пират пытается и корабль спасти, и свои личные безумные цели выполнить.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Запретный остров", desc: "Отличный семейный кооператив, где вы командой прочесываете тонущий остров в поисках древних артефактов. Вода прибывает с каждым ходом, земля уходит из-под ног, так что действовать нужно слаженно и быстро.", diff: 1, time: "30–45 мин", tmax: 45 },
  { name: "Звездные войны. Внешнее кольцо", desc: "Настоящая космическая песочница, где вы можете стать самым известным наемником, контрабандистом или охотником за головами в далекой-далекой галактике. Модернизируйте свой корабль, уходите от патрулей Империи и зарабатывайте авторитет.", diff: 3, time: "90–150 мин", tmax: 150 },
  { name: "Зеленая деревня", desc: "Легкая и приятная карточная стратегия, в которой вы соревнуетесь за звание лучшего ландшафтного дизайнера поселения. Никакого хардкора — только уютное обустройство садов, домиков и сбор победных очков.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Игра престолов", desc: "Шедевр настольной дипломатии, предательств и боли, где союзы живут ровно до того момента, пока соседу не понадобится ваш замок. Забудьте про дружбу на эти 4 часа, ведь в игре престолов ты либо побеждаешь, либо... ну, вы сами знаете.", diff: 4, time: "120–180 мин", tmax: 180 },
  { name: "Изомагия", desc: "Оригинальная семейная игра, где вы соединяете точки линиями на своем планшете, чтобы первыми угадать, какой волшебный рисунок получается. Отличная проверка на внимательность, скорость и пространственное мышление.", diff: 2, time: "30+ мин", tmax: 30 },
  { name: "Имаджинариум", desc: "Классика отечественных вечеринок, построенная на угадывании безумных, красивых и порой пугающих ассоциаций к картам. Главное — мыслить достаточно тонко, чтобы вашу карту угадали, но не все сразу.", diff: 1, time: "30–45 мин", tmax: 45 },
  { name: "Камисадо", desc: "Очень стильные «цветные шахматы», где каждый ваш ход определяет, какой именно фигурой сможет пойти соперник в свой черед. Дуэль идет на удивление быстро, но заставляет просчитывать комбинации на несколько шагов вперед.", diff: 3, time: "15+ мин", tmax: 15 },
  { name: "Камни Рогнарека", desc: "Динамичная дуэль, в которой игроки выставляют рунические камни и пытаются захватить как можно больше территорий на поле. Мифы, викинги и чистый расчет без какого-либо рандома.", diff: 3, time: "30+ мин", tmax: 30 },
  { name: "Каркассон", desc: "Мировая настольная классика про выкладывание плиток земель Средневековья и захват замков, дорог и полей своими деревянными человечками. Проста в освоении, но таит в себе огромный простор для коварной борьбы за чужие территории.", diff: 2, time: "30–45 мин", tmax: 45 },
  { name: "Карманный детектив", desc: "Миниатюрное, но очень затягивающее детективное расследование, умещающееся в одну колоду карт. Опрашивайте свидетелей, собирайте улики и помните, что каждое действие тратит драгоценное игровое время.", diff: 2, time: "30+ мин", tmax: 30 },
  { name: "Картографы", desc: "Королева фэнтезийных игр «нарисуй свое королевство», где вы по капризу королевы чертите на листочке леса, горы и деревни. Всё идет отлично, пока соседи не передают вам свой планшет, чтобы лично нарисовать на вашей идеальной карте засаду монстров.", diff: 1, time: "20–30 мин", tmax: 30 },
  { name: "Карточна война кольца", desc: "Компактная, но глубокая карточная битва по мотивам Толкина для тех, у кого нет времени раскладывать огромную коробку оригинальной Войны Кольца. Тонны атмосферы, тактические решения и извечное противостояние Свободных Народов и Тьмы.", diff: 5, time: "уточнить", tmax: 60 },
  { name: "Кворум", desc: "Отечественная пати-игра, которая заставит вас включить свое ораторское мастерство на максимум и до до хрипоты убеждать окружающих в своей правоте. Отличный способ узнать, кто из ваших друзей прирожденный политик, а кто просто умеет громко кричать.", diff: 1, time: "30+ мин", tmax: 30 },
  { name: "Кодекс природы", desc: "Визуально безупречная карточная игра, где вы аккуратно накладываете уголки карт друг на друга, пытаясь собрать идеальные цепочки ресурсов. Маленькая, изящная и заставляющая хорошенько раскинуть мозгами.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Королевство кроликов", desc: "Занимайте лучшие территории на поле, добывайте ресурсы и стройте огромные замки для своих ушастых подданных. Игра сочетает в себе хитрый драфт карт и забавное оформление, которое точно никого не оставит равнодушным.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Король воров", desc: "Веселая экономическая игра с кубами, где вам предстоит грабить караваны, воровать у соперников и вовремя прятать награбленное в тайник. Главное — вовремя побороть свою жадность, пока другие воришки не обчистили вас до нитки.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Крагморта", desc: "Угарная игра про гоблинов, которые пытаются стащить магические книги из библиотеки Великого Архимага Ригора Мортиса. Тот, кто попадется на глаза хозяину, получает реальные и очень смешные проклятия вроде «играй с зажатым между коленями подбородком».", diff: 2, time: "30+ мин", tmax: 30 },
  { name: "Красный собор", desc: "Плотное стратегическое евро, в котором вы соревнуетесь за право строить знаменитый Храм Василия Блаженного для Ивана Грозного. Менеджмент ресурсов здесь завязан на очень интересном механическом ронделе с кубиками.", diff: 3, time: "30–60 мин", tmax: 60 },
  { name: "Крестики-нолики на максималках. Пентаго", desc: "Крестики-нолики на максималках, где после каждого выставленного шарика вы обязаны повернуть одну из четвертей игрового поля на 90 градусов. Пространственное мышление ломается мгновенно, а победа часто приходит с той стороны, откуда не ждали.", diff: 2, time: "10–15 мин", tmax: 15 },
  { name: "Кринж", desc: "Максимально абсурдная и веселая игра для вечеринок, где нужно отвечать на глупые вопросы невпопад и пытаться не словить тот самый статус «Кринж». Отличный легкий филлер, чтобы расслабиться в веселой компании.", diff: 2, time: "20+ мин", tmax: 20 },
  { name: "Кто же тут ?", desc: "Простая и веселая пати-игра на ассоциации и логику, где вам предстоит угадывать тайных персонажей по наводкам ведущего. Прекрасно подходит для того, чтобы скоротать вечер с семьей или друзьями.", diff: 1, time: "уточнить", tmax: 60 },
  { name: "Ктулху", desc: "Динамичный и безумный боевой кооператив, где вы не прячетесь от древних монстров, а целенаправленно прокачиваете свои психозы, чтобы лично набить морду Ктулху. Огромные миниатюры, куча стрельбы и веселое безумие.", diff: 2, time: "40+ мин", tmax: 40 },
  { name: "Кубическая рыбалка", desc: "Азартный отечественный кубомёт, где вы пытаетесь поймать самую крупную и редкую рыбу с помощью бросков разноцветных зариков. Быстрая, азартная и идеальная для семейных посиделок.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Кубострелка", desc: "Динамичная настолка на скорость и реакцию, где все завязано на бросках кубиков и быстром поиске нужных комбинаций. Отличный способ размять пальцы и проверить, у кого из друзей реакция мангуста.", diff: 1, time: "уточнить", tmax: 60 },
  { name: "Куры", desc: "Неожиданно глубокая карточная стратегия, где вы становитесь птицеводом и пытаетесь выстроить идеальный курятник из редких пород кур. Собирайте сеты, следите за соседями и помните: петухи тоже приносят победные очки!", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Лава Лэнд", desc: "Быстрая семейная игра про спасение симпатичных монстриков с острова, на котором вот-вот рванет вулкан. Кидайте кубики, бегите к лодкам по застывающей лаве и старайтесь не толкать попутчиков... хотя кого мы обманываем?", diff: 2, time: "40+ мин", tmax: 40 },
  { name: "Лесные тайны", desc: "Уютная отечественная игра на выставление рабочих, где очаровательные лесные зверушки собирают припасы на зиму. Добрая атмосфера, простые правила и капля здоровой конкуренции за самые лакомые грибные места.", diff: 4, time: "уточнить", tmax: 60 },
  { name: "Лимпопо", desc: "Хаотичная карточная игра для вечеринок, где нужно собирать комбинации из забавных животных на руке. Простые правила, яркие картинки и быстрая скорость партий — то, что нужно для расслабленного отдыха.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Литигаторы. Юристы в деле", desc: "Редкий и очень веселый отечественный кубомет, где вы притворяетесь зубастыми адвокатами, ведущими судебные процессы. Бросайте кубики аргументов, подкупайте свидетелей и выигрывайте дела любыми правдами и неправдами.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Лоскутное королевство", desc: "Великолепный семейный хит, в котором вы собираете свое королевство из доминошек с разными типами ландшафтов. Нужно не просто состыковать поля и леса, но и урвать как можно больше плиток с коронами для умножения очков.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Магомаркет", desc: "Уникальный кооператив в реальном времени, где фэнтезийные герои грабят супермаркет, а игрокам запрещено разговаривать друг с другом. Полное безмолвие, паника, тикающий таймер и отчаянный стук деревянной фишки перед носом зазевавшегося друга.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Макроскоп", desc: "Интригующая семейная игра на дедукцию, где вы пытаетесь угадать скрытую картинку, глядя на нее сквозь узкие круглые окошки картонного прибора. Чем меньше окошек вы откроете перед правильным ответом, тем больше очков заработаете.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Маленькая империя Самураи", desc: "Компактная, но очень умная стратегия о разделении влияния в феодальной Японии. Выставляйте скрытые жетоны приказов, захватывайте города и перехитрите соперников на маленьком игровом поле.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Маленькие города", desc: "Залипательный отечественный ролл-энд-райт с крутой механикой, где каждый чертит свой собственный идеальный мегаполис на листочке. Проектируйте жилые зоны, прокладывайте парки и старайтесь обойти конкурентов по качеству жизни.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Мандрагора", desc: "Быстрая карточная игра, в которой вы становитесь лавочниками на магическом рынке, скупающими редкие ингредиенты для зелий. Не зевайте, собирайте нужные сеты мандрагор и остерегайтесь проклятий, которые могут обнулить ваши труды.", diff: 2, time: "30+ мин", tmax: 30 },
  { name: "Манчкин", desc: "Легендарное издевательство над ролевыми играми, где главное правило — «Мочи монстров, хапай сокровища, подставляй друзей». Прокачивайте своего хафлинга-клирика до 10 уровня и будьте готовы к тому, что в шаге от победы в вас прилетит тонна проклятий от всего стола.", diff: 2, time: "60–90 мин", tmax: 90 },
  { name: "Маятник", desc: "Хардкорная стратегия в реальном времени, где вместо ходов вы управляете своими рабочими с помощью настоящих песочных часов. Думать нужно невероятно быстро, пока песок неумолимо течет, а соперники занимают лучшие замки.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Между двух замков безумного короля Людвига", desc: "Необычная игра, где вы строите замки в паре со своими соседями справа и слева. Придется постоянно договариваться и искать компромиссы, ведь ваш итоговый результат будет считаться по самому слабому из двух построенных замков.", diff: 2, time: "40–60 мин", tmax: 60 },
  { name: "Мертвый сезон", desc: "Атмосферный зомби-кооператив с изюминкой: у каждого выжившего есть своя скрытая цель, а в колоде может прятаться коварный предатель. Боритесь за выживание колонии, принимайте тяжелые моральные решения по книге перекрестков и не верьте никому.", diff: 3, time: "45+ мин", tmax: 45 },
  { name: "Микадо", desc: "Классическая игра на ловкость рук и стальные нервы, где нужно по одной вытаскивать тонкие деревянные палочки из общей хаотичной кучи. Одно неловкое движение, шевельнувшаяся соседняя палочка — и ход переходит к следующему хирургу.", diff: 1, time: "10–15 мин", tmax: 15 },
  { name: "Микрополис", desc: "Симпатичная семейная настолка, где вы строите свой собственный подземный муравейник. Нанимайте солдат, копайте казармы, собирайте вкусные фрукты и следите за тем, чтобы у вашей королевы муравьев было самое роскошное жилище.", diff: 4, time: "уточнить", tmax: 60 },
  { name: "Мистериум", desc: "Прекрасный детективный кооператив, где один игрок становится молчаливым призраком, а остальные — экстрасенсами. Призрак пытается раскрыть тайну своей гибели, посылая игрокам сны в виде сюрреалистичных картинок.", diff: 2, time: "30–45 мин", tmax: 45 },
  { name: "Монополия", desc: "Главный разрушитель семейных вечеров и многолетней дружбы со столетней историей. Скупайте заводы, стройте отели, банкротьте родственников и надейтесь не сесть в тюрьму прямо перед чужой дорогой недвижимостью.", diff: 2, time: "60–180 мин", tmax: 180 },
  { name: "Море, соль, бумага", desc: "Карманный карточный шедевр с оформлением в стиле оригами, который заставит вас азартно собирать комбинации из рыбок и кораблей. Вся фишка в механике финала: вы можете рискнуть и объявить последний раунд, дав соперникам шанс перегнать вас.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Мяури", desc: "Азартная карточная игра на ставки, где пушистые котики пытаются наловить как можно больше вкусной рыбки. Главное — правильно рассчитывать ценность карт и надеяться, что удача не повернется к вам пушистым хвостом.", diff: 2, time: "30+ мин", tmax: 30 },
  { name: "Немезида", desc: "Настоящий кинематографичный хоррор на вашем столе, вдохновленный фильмом «Чужой». Вы просыпаетесь на космическом корабле, вокруг рыщут жуткие пришельцы, системы ломаются, а у каждого члена экипажа есть своя личная (и порой очень эгоистичная) цель.", diff: 4, time: "90–180 мин", tmax: 180 },
  { name: "Неон", desc: "Динамичная отечественная киберпанк-стратегия с кучей стрельбы, ярким неоновым дизайном и агрессивным взаимодействием игроков. Прокачивайте своих бойцов, захватывайте сектора города и не жалейте патронов для конкурентов.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Неустрашимые", desc: "Великолепный тактический варгейм на двоих, построенный на механике колодостроя. Вы управляете взводом солдат во время Второй мировой войны, где каждая потерянная карта — это буквально раненый или погибший боец на поле боя.", diff: 3, time: "45+ мин", tmax: 45 },
  { name: "Ночь Ниндзя", desc: "Быстрая игра со скрытыми ролями для веселой компании, где вы делитесь на два враждующих клана ниндзя. Убивайте врагов в темноте, защищайте своего кланового лидера и пытайтесь понять по глазам соседей, кто здесь свой, а кто чужой.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Нуар", desc: "Стильный детективный поединок, превращающий игровое поле из карт в настоящий нуарный город. Один из вас становится хитрым убийцей или вором, скрывающимся среди мирных граждан, а второй — сыщиком, пытающимся вычислить преступника по цепочке улик.", diff: 2, time: "30+ мин", tmax: 30 },
  { name: "Обезьянки акробатки", desc: "Веселая детская игра на ловкость, от которой, впрочем, не откажутся и взрослые под конец вечеринки. Вытаскивайте разноцветные палочки из прозрачного дерева так, чтобы висящие на них пластиковые мартышки не посыпались вниз.", diff: 1, time: "5+ мин", tmax: 5 },
  { name: "Окошки", desc: "Уютная и безумно милая отечественная дуэль про котиков, уютно устроившихся на подоконниках. Соревнуйтесь в сборе самых красивых пушистых комбинаций и наслаждайтесь по-настоящему ламповой атмосферой вечера.", diff: 2, time: "30+ мин", tmax: 30 },
  { name: "Оранж квест", desc: "Безумное карточное приключение по мотивам комиксов про вселенную Orange, полное шуток, драк со странными боссами и деления конфетной добычи. Простые правила, яркий стиль и отличный повод весело провести время.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Орифлама 1, 2 и 3 части", desc: "Быстрая и невероятно жестокая игра про интриги и борьбу за королевский трон. Вы выкладываете карты персонажей в общий ряд лицом вниз, а затем азартно их вскрываете, казня чужих лордов, воруя очки и устраивая подлянки.", diff: 3, time: "20–30 мин", tmax: 30 },
  { name: "Особняки безумия", desc: "Глубокий кооперативный детектив во вселенной Лавкрафта, который полностью управляется бесплатным цифровым приложением на планшете. Исследуйте старинные дома, разгадывайте головоломки на экране и отбивайтесь от оживших чудовищ.", diff: 4, time: "120–180 мин", tmax: 180 },
  { name: "Остров кошек. Исследуй и рисуй", desc: "Компактная версия популярной настолки, где вы спасаете разноцветных котиков с тонущего острова и плотно укладываете их в каюты своего корабля в стиле Тетриса. Вместо пластиковых фигурок здесь нужно аккуратно рисовать кошачьи силуэты маркером.", diff: 2, time: "30–60 мин", tmax: 60 },
  { name: "Палео", desc: "Великолепный и довольно сложный кооператив про выживание первобытного племени в каменном веке. Изучайте опасный окружающий мир, изобретайте новые орудия труда, боритесь с болезнями и дикими зверями ради того, чтобы просто дожить до утра.", diff: 2, time: "60–90 мин", tmax: 90 },
  { name: "Перекати ежик и друзья", desc: "Чудесная детская игра с уникальной механикой: вы буквально катите по столу пушистый тканевый мячик-ёжик, к которому на липучках цепляются лесные трофеи — грибы, яблоки и листочки. Отличный способ весело провести время с малышами.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Письма призрака", desc: "Отечественный детективный хит на ассоциации и скрытые роли, напоминающий смесь Мистериума и Мафии. Убитый детектив стал призраком и пытается с помощью карт-подсказок указать живым коллегам на убийцу, который сидит прямо среди них и активно путает следы.", diff: 1, time: "уточнить", tmax: 60 },
  { name: "Покорители космоса", desc: "Красивая карточная стратегия от нашего разработчика, пропитанная эстетикой советского ракетостроения. Нанимайте лучших ученых, развивайте космические проекты и стройте свои легендарные спутники быстрее конкурентов.", diff: 2, time: "45+ мин", tmax: 45 },
  { name: "Последний час", desc: "Быстрая и напряженная кооперативная игра во вселенной Аркхэма, где ритуал Древнего уже начался и у вас есть ровно один час, чтобы сдержать волны монстров. Никаких долгих блужданий — только чистый экшен, тактика и попытки закрыть пространственные врата.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Поэзиум", desc: "Тот же Имаджинариум, но вместо обычных слов вам придется изъясняться исключительно поэтическими строками и метафорами. Прекрасный выбор для творческих компаний, готовых превратить настольный вечер в настоящий поэтический баттл.", diff: 2, time: "30+ мин", tmax: 30 },
  { name: "Прага. Сердце империи", desc: "Большое, комплексное и невероятно красивое евро для истинных настольных гиков. Вам предстоит заняться масштабным строительством средневековой Праги по приказу короля Карла IV, просчитывая сложнейшие цепочки действий на трехмерном поле.", diff: 5, time: "90+ мин", tmax: 90 },
  { name: "Предельное погружение", desc: "Короткая и невероятно азартная игра на жадность, где вы делите один баллон кислорода на всех подводников в поисках сокровищ. Чем глубже вы опускаетесь, тем ценнее добыча, но если кто-то начнет паниковать и тащить золото наверх — задохнуться могут абсолютно все.", diff: 1, time: "15+ мин", tmax: 15 },
  { name: "Приключения Робина Гуда", desc: "Потрясающий семейный кооператив с живой книгой сказок и уникальным трансформирующимся полем. Вы буквально перемещаете своих героев по лесу без всяких клеток, вытаскивая жетоны из специальных пазов прямо на картонном поле.", diff: 3, time: "60+ мин", tmax: 60 },
  { name: "Про рисунки", desc: "Угарный отечественный ролл-энд-райт для вечеринок, где нужно рисовать загаданные слова, используя только ограниченный набор геометрических фигур. Попробуйте изобразить «честность» или «холодильник» с помощью двух кругов и одной линии за пару минут!", diff: 2, time: "2+ мин", tmax: 2 },
  { name: "Рик и морти", desc: "Безумные карточные приключения по мотивам культового мультсериала, наполненные фирменным черным юмором, межпространственными порталами и тонной хаоса. Стреляйте в паразитов, не верьте собственным воспоминаниям и спасайте Землю... или взрывайте ее.", diff: 2, time: "40+ мин", tmax: 40 },
  { name: "Свинокрыл", desc: "Безумно веселый и быстрый филлер на внимательность и реакцию, где вам нужно искать пары для самых нелепых скрещенных животных. Как только увидите летающую свинью или птице-черепаху — бейте по карте быстрее всех!", diff: 2, time: "30+ мин", tmax: 30 },
  { name: "Селедка", desc: "Быстрая отечественная настольная игра, которая идеально подойдет для легкого перекуса между сложными стратегиями. Простые правила, азартный игровой процесс и море веселья гарантированы.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Серп", desc: "Монументальная альтернативная история, где крестьяне соседствуют с огромными ржавыми боевыми роботами-мехами. Развивайте свою фракцию, собирайте зерно, отправляйте рабочих на шахты и помните: здесь демонстрация военной мощи часто работает лучше, чем сама война.", diff: 4, time: "90–120 мин", tmax: 120 },
  { name: "Сиггил", desc: "Уютный, красивый и очень медитативный карточный пасьянс, сильно напоминающий маджонг. Вам нужно аккуратно разбирать общую пирамиду карт, освобождая запертых духов природы и собирая из них самые выгодные комбинации.", diff: 3, time: "20+ мин", tmax: 20 },
  { name: "Сонора", desc: "Единственная в своем роде игра, объединившая в себе механику щелчков по фишкам (как в чапаеве) и ролл-энд-райт. Вы запускаете свои диски на круглом поле, а затем, в зависимости от того, куда они прилетели, заполняете сложные галочки в своих блокнотах.", diff: 2, time: "40+ мин", tmax: 40 },
  { name: "Стальная арена", desc: "Динамичная тактическая стратегия от нашего автора про яростные бои огромных роботов на модульном поле. Двигайтесь, поворачивайте корпус, стреляйте из лазеров и разбирайте поверженных врагов на запчасти прямо в процессе матча.", diff: 2, time: "40+ мин", tmax: 40 },
  { name: "Стройполис", desc: "Крошечная кооперативная игра из 18 карт, которая заставит вас спорить до хрипоты о планировании дорог и кварталов. Вам нужно выполнить жесткие условия градостроительных заказов, уложившись в строгий лимит по очкам.", diff: 2, time: "20+ мин", tmax: 20 },
  { name: "Сумеречная борьба", desc: "Культовая масштабная дуэль, признанная одним из лучших варгеймов в мире, посвященная Холодной войне между СССР и США. Перетягивайте канаты влияния по всему земному шару, устраивайте военные перевороты и балансируйте на грани ядерного апокалипсиса.", diff: 5, time: "120–180 мин", tmax: 180 },
  { name: "Супер кот", desc: "Сумасшедший вариант игры «камень-ножницы-бумага» на максималках, превращенный в веселый супергеройский баттл. Выкидывайте пальцы, превращайте обычных котов в Суперкотов и попробуйте коллективно завалить огромного Робопса.", diff: 1, time: "10+ мин", tmax: 10 },
  { name: "Супер Мега Бинго", desc: "Старое доброе классическое лото, которому ввели ударную дозу адреналина и современных механик. Вычеркивайте цифры на карточках, запускайте безумные комбо-цепочки бонусов и кричите заветное «Бинго!» быстрее всех за столом.", diff: 2, time: "10+ мин", tmax: 10 },
  { name: "Суперечная борьба", desc: "Культовая масштабная дуэль, посвященная Холодной войне между СССР и США. Перетягивайте канаты влияния по всему земному шару, устраивайте военные перевороты и балансируйте на грани ядерного апокалипсиса.", diff: 5, time: "120–180 мин", tmax: 180 },
  { name: "Счастливая капибара", desc: "Максимально чилловая и добрая семейная настолка, посвященная самому дружелюбному животному на планете. Путешествуйте, заводите друзей среди зверей и наслаждайтесь спокойным, умиротворяющим игровым процессом.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Таверна Красный дракон", desc: "Шумная пати-игра про то, что делают фэнтезийные герои после зачистки подземелья — конечно же, идут пить эль в таверну! Пропивайте золото, жульничайте в карты, деритесь с товарищами и попробуйте остаться на ногах к концу пьянки.", diff: 2, time: "60–90 мин", tmax: 90 },
  { name: "Тайный Гитлер", desc: "Одна из лучших психологических игр на социальную дедукцию, где стол делится на либералов и скрытых фашистов. Бурные споры, взаимные обвинения, фальсификация законов и вечный параноидальный вопрос: «Почему ты передал мне этот закон?!».", diff: 2, time: "30–45 мин", tmax: 45 },
  { name: "Тако, кот, коза, сыр, пицца", desc: "Безумный хит на скорость реакции, который заставит всю вашу компанию яростно хлопать ладонями по центру стола. По очереди называйте слова из названия игры, выкладывайте карты, и как только слово совпало с картинкой — бейте по куче, пока вас не оштрафовали!", diff: 1, time: "10–15 мин", tmax: 15 },
  { name: "Тараканы в холодильнике", desc: "Быстрая отечественная игра на блеф и скрытые ставки, где вам предстоит незаметно подкидывать усатых вредителей в чужие запасы еды. Простые правила, куча смеха и постоянные попытки раскусить коварные планы соперников.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Телевизор", desc: "Веселая пати-игра, построенная на механике «испорченного телефона», но с использованием рисунков и надписей. Начните с безобидной фразы, посмотрите, как ее нарисует ваш друг, и посмейтесь над тем, как к концу круга она превратится в нечто абсолютно абсурдное.", diff: 2, time: "уточнить", tmax: 60 },
  { name: "Тени Амстердам", desc: "Динамичное командное соревнование в реальном времени, скрестившее Кодовые имена и Диксит. Капитаны ведут свои детективные агентства по карте города с помощью красивых картинок-ассоциаций, пока соперники наступают на пятки.", diff: 3, time: "30+ мин", tmax: 30 },
  { name: "Тираны подземья", desc: "Шикарное сочетание контроля территорий на поле и колодостроя в темном фэнтезийном мире дроу. Нанимайте убийц, плетите интриги, отправляйте шпионов в чужие города и безжалостно уничтожайте отряды конкурентов ради власти.", diff: 5, time: "60–90 мин", tmax: 90 },

function diceSvg(n, on){
  const layouts = { 1:[[1,1]], 2:[[0,0],[2,2]], 3:[[0,0],[1,1],[2,2]], 4:[[0,0],[0,2],[2,0],[2,2]], 5:[[0,0],[0,2],[1,1],[2,0],[2,2]] };
  const pos = layouts[n] || layouts[1];
  const coord = i => 5 + i * 7;
  const circles = pos.map(([r,c]) => `<circle class="pip" cx="${coord(c)}" cy="${coord(r)}" r="2.1"/>`).join('');
  return `<svg class="${on ? 'on' : ''}" viewBox="0 0 24 24"><rect class="face" x="2" y="2" width="20" height="20" rx="5"/>${circles}</svg>`;
}
function diceRow(level){
  let out = '';
  for(let i=1;i<=5;i++){ out += diceSvg(i, i<=level); }
  return `<span class="dice">${out}</span>`;
}

const listEl = document.getElementById('game-list');
const countEl = document.getElementById('result-count');
const diffFilterEl = document.getElementById('diff-filters');
const timeFilterEl = document.getElementById('time-filters');
const searchInput = document.getElementById('search-input');

// build difficulty chips (1–5)
for(let level = 1; level <= 5; level++){
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.type = 'button';
  chip.innerHTML = `<span class="mini-dice">${Array.from({length: level}).map(() => '<svg viewBox="0 0 10 10"><circle class="pip" cx="5" cy="5" r="4.5"/></svg>').join('')}</span>`;
  chip.addEventListener('click', () => {
    if(state.diffs.has(level)) state.diffs.delete(level); else state.diffs.add(level);
    chip.classList.toggle('active');
    render();
  });
  diffFilterEl.appendChild(chip);
}

// build time chips
timeBuckets.forEach(bucket => {
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.type = 'button';
  chip.textContent = bucket.label;
  chip.addEventListener('click', () => {
    if(state.times.has(bucket.key)) state.times.delete(bucket.key); else state.times.add(bucket.key);
    chip.classList.toggle('active');
    render();
  });
  timeFilterEl.appendChild(chip);
});

searchInput.addEventListener('input', e => {
  state.query = e.target.value.trim().toLowerCase();
  render();
});

function matches(g){
  const q = state.query;
  if(q && !(g.name.toLowerCase().includes(q) || g.desc.toLowerCase().includes(q))) return false;
  if(state.diffs.size && !state.diffs.has(g.diff)) return false;
  if(state.times.size){
    const inSelected = timeBuckets.some(b => state.times.has(b.key) && b.test(g));
    if(!inSelected) return false;
  }
  return true;
}

function render(){
  const shown = games.filter(matches);
  countEl.textContent = `Показано ${shown.length} из ${games.length}`;

  if(!shown.length){
    listEl.innerHTML = `<div class="empty-state">Ничего не нашлось — попробуйте изменить фильтры.</div>`;
    return;
  }

  listEl.innerHTML = shown.map(g => `
    <div class="row">
      <div class="swatch">
        <svg viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="3">
          <path d="M50 6 L88 28 V72 L50 94 L12 72 V28 Z M50 6 V94 M12 28 L50 50 L88 28 M12 72 L50 50 L88 72"/>
        </svg>
      </div>
      <div class="row-text">
        <h3>${g.name}</h3>
        <p>${g.desc}</p>
      </div>
      ${diceRow(g.diff)}
      <span class="time">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
        ${g.time}
      </span>
    </div>
  `).join('');
}

render();
</script>
</body>
</html>
